Tapioca de três queijos", "preco": 21}, {"id": 44, "nome": "Queijo, calabresa, tomate e orégano", "preco": 21}, {"id": 45, "nome": "Frango com catupiry e orégano", "preco": 21}, {"id": 46, "nome": "Goiabada com queijo", "preco": 21}, {"id": 47, "nome": "Nutella com banana ou doce de leite", "preco": 21}, {"id": 48, "nome": "Nutella com morango", "preco": 21}, {"id": 49, "nome": "KitKat e queijo", "preco": 21}, {"id": 50, "nome": "Galak e queijo", "preco": 21}, {"id": 51, "nome": "Prestígio", "preco": 21}, {"id": 52, "nome": "Ovomaltine", "preco": 21}, {"id": 53, "nome": "Leite Ninho com morango ou banana", "preco": 21}]}, {"id": "bebidas", "nome": "Bebidas", "itens": [{"id": 119, "nome": "Água com gás", "preco": 4}, {"id": 120, "nome": "Água sem gás", "preco": 4}, {"id": 125, "nome": "Refrigerante lata", "preco": 8}, {"id": 126, "nome": "Refrigerante lata zero", "preco": 8}, {"id": 127, "nome": "Refrigerante 600 ml", "preco": 10}, {"id": 128, "nome": "Refrigerante zero 600 ml", "preco": 10}, {"id": 129, "nome": "Refrigerante 2 litros", "preco": 16}, {"id": 130, "nome": "Refrigerante zero 2 litros", "preco": 16}, {"id": 121, "nome": "Suco Prats 300 ml", "preco": 7}, {"id": 122, "nome": "Suco Prats 900 ml", "preco": 15}, {"id": 123, "nome": "Suco Prats 1,5 litros", "preco": 20}, {"id": 124, "nome": "Red Bull 250 ml", "preco": 12}]}];  // ofertas e bebidas de 22/11 (cardápio real do banco)
/* Itens do buffet: lista real do cardápio de 17/11 (Cardápio Completo + Carnes), só para ver como fica */
var BUFFET_HOJE=["Arroz branco","Arroz integral","Feijão","Lentilha","Macarrão ao molho vermelho","Mandioca cozida","Fortaia","Farofa","Batatinha frita","Polenta sapecada","Ovo frito","Repolho e couve refogado","Radite refogado com bacon e ovo","Frango com creme de milho","Pizza doce","Pizza salgada","Bolinho de pão doce","Bolinho de pão","Banana frita","Chuleta / bife de gado na chapa","Filé de frango na chapa","Costelinha de porco frita","Carne de gado ao molho"];
/* No teste: adicione ?fechado=1 no endereço para ver o app fechado */
var ABERTO=location.search.indexOf("fechado")<0;
var HORA=null,AGORA0=0,T0=0,SEM_CARD=false,ENTREGA_OK=true;   // horário vem do banco (horario_abre, horario_fecha, entrega_ate)
function minTxt(t){var p=String(t||"").split(":");return Number(p[0])*60+Number(p[1]||0)}
function agoraTxt(){var m=(AGORA0+Math.floor((Date.now()-T0)/60000))%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function hr(){return HORA||{abre:"09:30",fecha:"13:30",entrega:"13:00"}}
function recalc(){
 if(!HORA||location.search.indexOf("fechado")>=0)return;
 var a=agoraTxt();ABERTO=!SEM_CARD&&a>=HORA.abre&&a<HORA.fecha;ENTREGA_OK=!HORA.entrega||a<HORA.entrega;
 if(!ENTREGA_OK&&S.modo==="Entrega")S.modo="Retirada"}
var REAL=false;
var STATUS=location.search.indexOf("falha")>=0?"falha":(location.search.indexOf("exemplo")>=0?"ok":"carregando");  // carregando | ok | falha (?exemplo=1 usa o cardápio de exemplo; ?falha=1 mostra a tela de falha)
var ZAP="554991680422";  // WhatsApp do restaurante (confirmar)  // true quando o cardápio veio do banco (n8n)
var BASE="https://boldsquid-n8n.cloudfy.live/webhook/app-carniel/";
var API=BASE+"cardapio";
var BUFFET_ID={};

/* ===== ESTADO ===== */
var S={view:"home",modo:null,grupo:"ofertas",cart:[],sheet:null,end:{apelido:"",bairro:"Na cidade",rua:"",num:"",comp:""},pag:"Pix",troco:"",talh:0,pedidos:[],enderecos:[],ultimo:null};
try{S.pedidos=JSON.parse(localStorage.getItem("pc_pedidos")||"[]");S.enderecos=JSON.parse(localStorage.getItem("pc_end")||"[]");}catch(e){}
try{S.token=localStorage.getItem("pc_token")||"";S.nome=localStorage.getItem("pc_nome")||"";S.telDig=localStorage.getItem("pc_tel")||""}catch(e){S.token="";S.nome="";S.telDig=""}
S.loginPasso="tel";S.msg="";S.zapBtn=false;S.volta="checkout";S.meus=null;S.meusCarregando=false;S.enviando=false;S.chave=null;S.nomeDig="";S.codigoDig="";
function post(p,b){return fetch(BASE+p,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json()})}
function devId(){try{var d=localStorage.getItem("pc_dev");if(!d){d=Math.random().toString(36).slice(2,10)+Date.now().toString(36);localStorage.setItem("pc_dev",d)}return d}catch(e){return"sem-storage"}}
/* métricas: nunca atrapalha o app; não registra em modo de teste (?exemplo, ?falha, ?fechado) */
function track(ev,dados){try{if(/[?&](exemplo|falha|fechado)/.test(location.search))return;if(!REAL&&ev!=="falha_cardapio")return;fetch(BASE+"evento",{method:"POST",keepalive:true,headers:{"Content-Type":"application/json"},body:JSON.stringify({token:S.token||"",dev:devId(),evento:ev,dados:dados||{}})}).catch(function(){})}catch(e){}}
function hojeTxt(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
try{var C=JSON.parse(localStorage.getItem("pc_cart")||"null");if(C&&C.dia===hojeTxt()){S.cart=C.cart||[];S.modo=C.modo||null;S.end=C.end||S.end;S.pag=C.pag||S.pag;S.troco=C.troco||""}}catch(e){}
function salvar(){try{localStorage.setItem("pc_pedidos",JSON.stringify(S.pedidos));localStorage.setItem("pc_end",JSON.stringify(S.enderecos));localStorage.setItem("pc_cart",JSON.stringify({dia:hojeTxt(),cart:S.cart,modo:S.modo,end:S.end,pag:S.pag,troco:S.troco}));}catch(e){}}

/* ===== UTIL ===== */
function $(s){return document.querySelector(s)}
function brl(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function grupoDe(gid){return GRUPOS.filter(function(g){return g.id===gid})[0]}
function totais(linhas,taxa){var sub=0,pend=false;linhas.forEach(function(l){if(l.preco==null){pend=true}else{sub+=l.preco*l.qtd}});return {sub:sub,taxa:taxa||0,total:sub+(taxa||0),pend:pend}}
var PRECO_TALHER=1;  // R$ por talher (o banco confere; se a API mandar preco_talher, usa esse)
function valTalh(){return (S.talh||0)*PRECO_TALHER}
function totCart(){var t=totais(S.cart,taxaAtual()),v=valTalh();t.sub+=v;t.total+=v;return t}
var COMBINAR="A combinar";
function combinar(){return S.modo==="Entrega"&&S.end.bairro===COMBINAR}
function taxaAtual(){if(S.modo!=="Entrega"||S.end.bairro===COMBINAR)return 0;var b=BAIRROS.filter(function(x){return x.n===S.end.bairro})[0];return b?b.t:0}
function telFmt(t){var d=String(t||"").replace(/\D/g,"");if(d.length>=12&&d.indexOf("55")===0)d=d.slice(2);if(d.length===11)return"("+d.slice(0,2)+") "+d.slice(2,7)+"-"+d.slice(7);if(d.length===10)return"("+d.slice(0,2)+") "+d.slice(2,6)+"-"+d.slice(6);return String(t||"")}
function sair(){S.convenio=false;if(S.pag==="Convênio")S.pag="Pix";S.token="";S.nome="";S.meus=null;S.enderecos=[];try{localStorage.removeItem("pc_token");localStorage.removeItem("pc_nome");localStorage.removeItem("pc_end")}catch(e){}track("saiu");render()}
function ir(v){
 if(v==="checkout"&&S.view!=="checkout")track("fechar",{itens:S.cart.length});
 S.view=v;
 if(v==="pedidos")carregaMeus();
 if(v==="checkout")carregaEnderecos();
 render();window.scrollTo(0,0)}

/* ===== TELAS ===== */
/* ===== Versão e aviso de atualização (o app instalado confere se há versão nova) ===== */
var VERSAO="2026-11-23.5";   // MUDAR a cada publicação: é isso que faz o app instalado avisar
var NOVA=false;
function confereVersao(){
 if(location.protocol!=="https:")return;
 fetch("index.html?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.text()}).then(function(t){
  var m=t.match(/var VERSAO="([^"]+)"/);
  if(m&&m[1]!==VERSAO&&!NOVA){NOVA=true;render()}
 }).catch(function(){});
}
function atualizaApp(){
 var fim=function(){location.reload()};
 if(window.caches&&caches.keys)caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}).then(fim,fim);else fim();
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)confereVersao()});
setTimeout(confereVersao,4000);
/* ===== Instalar como app (Android: botão; iPhone: instrução) ===== */
var INST=null;
var JA_APP=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
var IOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
var INST_FECHADO=false;try{INST_FECHADO=localStorage.getItem("carniel_inst_fechado")==="1"}catch(e){}
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();INST=e;if(S.view==="home")render()});
window.addEventListener("appinstalled",function(){INST=null;JA_APP=true;track("app_instalado",{});render()});
function instalar(){if(!INST)return;track("clicou_instalar",{});INST.prompt();INST.userChoice.then(function(r){track("instalar_resposta",{r:r.outcome});INST=null;render()}).catch(function(){})}
function fechaInst(){INST_FECHADO=true;try{localStorage.setItem("carniel_inst_fechado","1")}catch(e){}render()}
function vInstalar(){
 if(JA_APP||INST_FECHADO)return"";
 if(INST)return'<div class="box"><b>📲 Instale o app</b><div class="peq">Fica na tela do seu celular, sem precisar procurar o link.</div><button class="btn" onclick="instalar()">Instalar o app</button><button class="rm" onclick="fechaInst()">Agora não</button></div>';
 if(IOS)return'<div class="box"><b>📲 Instale o app</b><div class="peq">No iPhone: toque em <b>Compartilhar</b> (o quadradinho com a seta) e depois em <b>Adicionar à Tela de Início</b>.</div><button class="rm" onclick="fechaInst()">Entendi</button></div>';
 return"";
}
function vHome(){
 var H=hr(),h='<header><span><img class="logo" src="logo.png" alt="">Restaurante Carniel</span><small>'+(ABERTO?"Aberto para pedidos":"Fechado")+'</small></header><div class="pad">';
 if(ABERTO){
  h+='<h2>Como quer receber?</h2>';
  if(ENTREGA_OK)h+='<button class="btn" onclick="escolherModo(\'Entrega\')">🛵 Entrega</button>';
  h+='<button class="btn" onclick="escolherModo(\'Retirada\')">🏪 Retirada</button>';
  if(HORA&&HORA.entrega)h+='<div class="peq">'+(ENTREGA_OK?'Entrega até as '+HORA.entrega+'. Depois disso, só retirada.':'Depois das '+HORA.entrega+' o pedido é só para retirada.')+'</div>';
 }else{
  var a=agoraTxt(),qdo='Os pedidos pelo app são feitos das '+H.abre+' às '+H.fecha+'.';
  if(SEM_CARD)h+='<h2>O cardápio de hoje ainda não está disponível</h2><p>'+qdo+' Volte mais tarde, quando o cardápio do dia estiver publicado.</p>';
  else if(HORA&&a<H.abre)h+='<h2>Ainda não estamos recebendo pedidos</h2><p>'+qdo+'</p>';
  else h+='<h2>Pedidos encerrados por hoje</h2><p>'+qdo+'</p>';
  h+='<button class="btn sec" onclick="ir(\'pedidos\')">Ver meus pedidos</button>';
 }
 return h+vInstalar()+'<div class="peq" style="text-align:center;margin-top:18px">versão '+VERSAO+'</div></div>';
}
function escolherModo(m){S.modo=m;track("modo",{modo:m});ir("menu")}
function vMenu(){
 var h='<header>Cardápio de hoje<small>'+(S.modo||'')+'</small></header><div class="tabs">';
 GRUPOS.forEach(function(g){h+='<button class="'+(g.id===S.grupo?"on":"")+'" onclick="S.grupo=\''+g.id+'\';render()">'+esc(g.nome)+'</button>'});
 h+='</div>';
 if(grupoDe(S.grupo).tipo==="pers")h+='<div class="aviso" style="background:#e8f1ff;color:#0b4ea2">Monte a sua marmita marcando os itens. O valor é definido na pesagem. Quer outra diferente? Monte de novo e insira outra Personalizada.</div>';
 if(grupoDe(S.grupo).aviso)h+='<div class="aviso" style="background:#e8f1ff;color:#0b4ea2">'+esc(grupoDe(S.grupo).aviso)+'</div>';
 grupoDe(S.grupo).itens.forEach(function(i){
  h+='<div class="item" onclick="abrirItem(\''+S.grupo+'\',\''+i.id+'\')"><span>'+esc(i.nome)+(i.desc?'<small style="display:block;font-size:12px;color:#777;font-weight:400">'+(S.grupo==="ofertas"?"Hoje: ":"")+esc(i.desc)+'</small>':'')+'</span>'+(i.preco==null?'<span class="p ac">preço na pesagem</span>':'<span class="p">'+brl(i.preco)+'</span>')+'</div>';
 });
 return h;
}
function abrirItem(gid,iid){
 var g=grupoDe(gid),it=g.itens.filter(function(x){return String(x.id)===String(iid)})[0];
 S.sheet={gid:gid,item:it,pers:g.tipo==="pers",qtd:1,obs:"",marcados:[],esc:null,opcoes:g.escolha||null};render();
}
function vSheet(){
 var s=S.sheet,h='<div class="sheetbg"><div class="sheet"><h2>'+esc(s.item.nome)+'</h2>';

   if(i.tipo_venda==="KG"){kg=true;var g=i.grupo||"Personalizada";if(!pers[g]){pers[g]=[];ordem.push(g)}pers[g].push(i.produto)}
   else h+='<div class="linha"><span>'+(i.quantidade||1)+'x '+esc(i.produto||"")+'</span><span>'+(i.preco_unit!=null?brl(Number(i.preco_unit)*(i.quantidade||1)):"")+'</span></div>'+(i.observacao?'<div class="peq">Obs: '+esc(i.observacao)+'</div>':'')});
  ordem.forEach(function(g){h+='<div class="linha"><span>'+esc(g==="Cardápio Completo"?"Personalizada":g)+'</span><span>'+(p.pesado?"":"a pesar")+'</span></div><div class="peq">'+esc(pers[g].join(", "))+'</div>'});
  if(p.modo==="ENTREGA"&&p.frete_a_combinar)h+='<div class="linha"><span>Taxa de entrega</span><span>a combinar</span></div>';
  else if(p.modo==="ENTREGA"&&Number(p.taxa)>0)h+='<div class="linha"><span>Taxa de entrega</span><span>'+brl(Number(p.taxa))+'</span></div>';
  h+='<div class="linha tot"><span>Total</span><span>'+brl(Number(p.total||0))+((kg&&!p.pesado)?' + pesagem':'')+(p.frete_a_combinar?' + frete':'')+'</span></div></div>';
 });
 return h+'</div>';
}
function vPedidos(){
 if(REAL&&S.token&&S.meus)return vPedidosBanco();
 var h='<header>Meus pedidos</header><div class="pad">';
 if(REAL&&S.token&&S.meusCarregando)h+='<p class="peq">Buscando os seus pedidos…</p>';
 if(REAL&&!S.token)h+='<div class="box"><b>Quer ver todos os seus pedidos?</b><div class="peq">Entre com o seu WhatsApp e o histórico aparece aqui, em qualquer aparelho.</div><button class="btn sec" onclick="S.loginPasso=\'tel\';S.msg=\'\';S.volta=\'pedidos\';ir(\'login\')">Entrar</button></div>';
 if(!S.pedidos.length)h+='<p>Você ainda não fez pedidos hoje.</p>';
 S.pedidos.forEach(function(p,k){
  h+='<div class="box"><b>Pedido #'+p.id+'</b> <span class="chip'+(p.status==="Entregue"?" ok":"")+'">'+p.status+'</span><div class="peq">'+quandoTxt(p.quando)+'</div><div class="peq">'+p.modo+' • '+p.pag+'</div>';
  p.itens.forEach(function(i){h+='<div class="linha"><span>'+i.qtd+'x '+esc(i.nome)+'</span><span>'+(i.preco==null?'a pesar':brl(i.preco*i.qtd))+'</span></div>'});
  h+='<div class="linha tot"><span>Total</span><span>'+brl(p.total)+(p.pend?' + pesagem':'')+'</span></div>'+
  (REAL?'':'<div class="peq">Só no exemplo: <button class="rm" onclick="avancar('+k+')">avançar status</button>'+(p.pend?' • <button class="rm" onclick="pesar('+k+')">equipe pesou (R$ 30)</button>':'')+'</div>')+'</div>';
 });
 return h+'</div>';
}
function avancar(k){var o=["Recebido","Em preparo","Entregue"],p=S.pedidos[k];p.status=o[Math.min(2,o.indexOf(p.status)+1)];salvar();render()}
function pesar(k){var p=S.pedidos[k];p.itens.forEach(function(i){if(i.preco==null)i.preco=30});var t=totais(p.itens,p.taxa);p.sub=t.sub;p.total=t.total;p.pend=false;salvar();render()}

/* ===== MONTAGEM ===== */
function render(){
 recalc();salvar();
 if(STATUS!=="ok"){
  var m=STATUS==="carregando"?'<h2>Carregando o cardápio…</h2><p>Só um instante.</p>':'<h2>Não consegui abrir o cardápio 😕</h2><p>Chame o restaurante pelo WhatsApp que a gente anota o seu pedido.</p><a class="btn" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box" onclick="track(\'clicou_zap\',{de:\'falha\'})" href="https://wa.me/'+ZAP+'?text='+encodeURIComponent("Oi! Não consegui usar o app de pedidos, quero fazer um pedido.")+'">Chamar o restaurante no WhatsApp</a><button class="btn sec" style="margin-top:10px" onclick="location.href=location.pathname">Tentar de novo</button>';
  $("#app").innerHTML='<header><span><img class="logo" src="logo.png" alt="">Restaurante Carniel</span></header><div class="pad">'+m+'</div>';$("#nav").innerHTML="";return;
 }
 var v=S.view,h="";
 if(!ABERTO&&(v==="menu"||v==="cart"||v==="checkout"))v="home";
 if(v==="home")h=vHome();
 else if(v==="menu")h=vMenu();
 else if(v==="cart")h=vCart();
 else if(v==="checkout")h=S.cart.length?vCheckout():vCart();
 else if(v==="done")h=vDone();
 else if(v==="pedidos")h=vPedidos();
 else if(v==="login")h=vLogin();
 if(REAL&&S.token&&S.telDig)h='<div class="logado"><span>📱 '+(S.nome?esc(S.nome.split(" ")[0])+' · ':'')+esc(telFmt(S.telDig))+'</span><button class="rm" onclick="sair()">Sair</button></div>'+h;
 if(NOVA)h='<div class="aviso" style="background:#d1e7dd;color:#0f5132;cursor:pointer;font-size:14px;text-align:center" onclick="atualizaApp()"><b>🔄 Nova versão do app — toque aqui para atualizar</b></div>'+h;
 if(!REAL){h='<div class="aviso">EXEMPLO — dados de mentira, nada aqui vai para o restaurante.</div>'+h}
 var q=S.cart.reduce(function(a,l){return a+l.qtd},0);
 if(v==="menu"&&q>0&&!S.sheet){var tb=totais(S.cart,0);tb.sub+=valTalh();h+='<div class="barra" onclick="ir(\'checkout\')"><span>🛒 '+q+(q===1?" item":" itens")+'</span><b>Fechar pedido</b><span>'+brl(tb.sub)+(tb.pend?'<small>+ pesagem</small>':'')+'</span></div>'}
 if(S.sheet)h+=vSheet();
 $("#app").innerHTML=h;
 var tabs=[["home","Início"],["cart","Carrinho"+(q?" ("+q+")":"")],["pedidos","Pedidos"]];
 $("#nav").innerHTML=tabs.map(function(t){var on=(v===t[0])||(t[0]==="home"&&(v==="menu"))||(t[0]==="cart"&&v==="checkout")||(t[0]==="pedidos"&&v==="done");return '<button class="'+(on?"on":"")+'" onclick="ir(\''+t[0]+'\')">'+t[1]+'</button>'}).join("");
}
/* ===== Cardápio real (n8n -> Postgres). Se falhar, mostra a tela "chame o restaurante no WhatsApp" ===== */
function aplicaApi(d){
 var G=[];
 if(d.ofertas&&d.ofertas.length)G.push({id:"ofertas",nome:"Ofertas",itens:d.ofertas.map(function(o,k){return{id:"o"+k,nome:o.nome,preco:Number(o.preco),desc:o.itens,ref:{k:"oferta",nome:o.nome}}})});
 if(d.tamanhos&&d.tamanhos.length)G.push({id:"marmitas",nome:"Marmitas",itens:d.tamanhos.map(function(t,k){return{id:"t"+k,nome:t.nome.replace(" c/ feijão separado"," — feijão separado"),preco:Number(t.preco),ref:{k:"tam",chave:t.chave}}})});
 G.push({id:"pers",nome:"Personalizada",tipo:"pers",itens:[{id:"PERS",nome:"Personalizada",preco:null}]});
 (d.por_unidade||[]).forEach(function(g){
  var pz=g.tipo==="PIZZA_CRUA_OU_ASSADA",id=pz?"pizza":(g.tipo==="SALADAS"?"saladas":"tapiocas");
  var o={id:id,nome:pz?"Pizzas":(g.tipo==="SALADAS"?"Saladas":"Tapiocas"),itens:(g.itens||[]).map(function(i){return{id:"u"+i.id,nome:(pz?"Pizza de ":"")+i.nome,preco:Number(g.preco),ref:{k:"prod",id:i.id}}})};
  if(pz)o.escolha=["Crua","Assada"];
  G.push(o)});
 if(d.bebidas&&d.bebidas.length)G.push({id:"bebidas",nome:"Bebidas",itens:d.bebidas.map(function(b){return{id:"b"+b.id,nome:b.nome,preco:Number(b.preco),ref:{k:"prod",id:b.id}}})});
 if(d.horario&&d.agora){HORA={abre:d.horario.horario_abre||"00:00",fecha:d.horario.horario_fecha||"23:59",entrega:d.horario.entrega_ate||""};AGORA0=minTxt(d.agora);T0=Date.now()}
 if(G.length<3){SEM_CARD=true;GRUPOS=G;S.grupo=G[0].id;REAL=true;STATUS="ok";return}   // sem cardápio publicado hoje: não é falha, é dia sem cardápio
 GRUPOS=G;
 if(d.buffet&&d.buffet.length)BUFFET_HOJE=d.buffet;
 (d.buffet_ids||[]).forEach(function(b){BUFFET_ID[b.nome]=b.id});
 if(d.preco_talher!=null&&!isNaN(Number(d.preco_talher)))PRECO_TALHER=Number(d.preco_talher);
 var padrao=Number(d.taxa_padrao);if(isNaN(padrao))padrao=2;
 BAIRROS=[{n:"Na cidade",t:padrao}].concat((d.locais||[]).map(function(l){return{n:l.nome,t:Number(l.taxa)}}));
 S.grupo=G[0].id;REAL=true;STATUS="ok";
}
if(STATUS==="carregando")try{fetch(API).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(d){aplicaApi(d);try{track("abriu",{ref:new URLSearchParams(location.search).get("o")||"",aberto:ABERTO,logado:!!S.token})}catch(e){}render()}).catch(function(e){console.log("API falhou",e);STATUS="falha";track("falha_cardapio");render()})}catch(e){STATUS="falha"}
if(STATUS==="carregando")setTimeout(function(){if(STATUS==="carregando"){STATUS="falha";track("falha_cardapio",{motivo:"demora"});render()}},12000);

render();
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
