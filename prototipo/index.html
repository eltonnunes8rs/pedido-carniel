<!DOCTYPE html>
<!-- Versão 22/11/2026 17:30 - PROTÓTIPO do app de pedidos Carniel. Dados de EXEMPLO, não conectado ao banco. -->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedido Carniel (protótipo)</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f4f4;color:#222}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;padding-bottom:130px}
  header{background:#b30000;color:#fff;padding:14px 16px;font-size:18px;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
  header small{font-weight:normal;font-size:12px;opacity:.9}
  .aviso{background:#fff3cd;color:#664d03;padding:8px 14px;font-size:12px}
  .pad{padding:16px}
  h2{margin:0 0 10px;font-size:18px}
  .btn{display:block;width:100%;padding:15px;border:0;border-radius:10px;background:#b30000;color:#fff;font-size:17px;margin:10px 0;cursor:pointer}
  .btn.sec{background:#fff;color:#b30000;border:2px solid #b30000}
  .btn:disabled{background:#bbb}
  .tabs{display:flex;overflow-x:auto;border-bottom:1px solid #ddd;background:#fff;position:sticky;top:0}
  .tabs button{flex:0 0 auto;padding:13px 16px;border:0;background:none;font-size:15px;color:#666;border-bottom:3px solid transparent}
  .tabs button.on{color:#b30000;border-color:#b30000;font-weight:bold}
  .item{display:flex;justify-content:space-between;gap:10px;padding:15px 16px;border-bottom:1px solid #eee;cursor:pointer}
  .item .p{color:#0a7a3d;font-weight:bold;white-space:nowrap}
  .item .p.ac{color:#b36b00;font-size:13px;white-space:normal;text-align:right}
  nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#b30000;display:flex}
  nav button{flex:1;padding:12px 4px;border:0;background:none;color:#fff;font-size:13px;opacity:.8}
  nav button.on{opacity:1;font-weight:bold;background:rgba(255,255,255,.15)}
  .sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:5}
  .sheet{background:#fff;width:100%;max-width:480px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}
  .qty{display:flex;align-items:center;gap:18px;margin:10px 0}
  .qty button{width:44px;height:44px;border-radius:50%;border:2px solid #b30000;background:#fff;color:#b30000;font-size:24px}
  .qty span{font-size:20px;min-width:24px;text-align:center}
  textarea,input,select{width:100%;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:15px;margin:6px 0;font-family:inherit}
  label.ck{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #f0f0f0;font-size:16px}
  label.ck input{width:22px;height:22px;margin:0}
  .linha{display:flex;justify-content:space-between;padding:6px 0}
  .tot{font-weight:bold;font-size:18px;border-top:2px solid #222;margin-top:8px;padding-top:10px}
  .chip{display:inline-block;padding:5px 11px;border-radius:14px;background:#e8f1ff;color:#0b4ea2;font-size:13px;margin:2px 4px 2px 0}
  .chip.ok{background:#dff5e6;color:#0a7a3d}
  .box{border:1px solid #ddd;border-radius:10px;padding:12px;margin:10px 0}
  pre{white-space:pre-wrap;background:#f1f8f1;border:1px solid #bfe0bf;border-radius:8px;padding:12px;font-size:14px;margin:8px 0}
  .peq{font-size:12px;color:#777}
  .rm{color:#b30000;background:none;border:0;font-size:13px;padding:0}
  .logo{width:38px;height:38px;border-radius:50%;margin-right:10px;vertical-align:middle;background:#fff}
  .barra{position:fixed;left:0;right:0;bottom:44px;max-width:480px;margin:0 auto;background:#0a7a3d;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;font-size:16px;cursor:pointer;z-index:4;box-shadow:0 -2px 8px rgba(0,0,0,.25)}
  .barra b{font-size:18px}
  .barra small{display:block;font-size:11px;opacity:.9}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<script>
/* ===== DADOS DE EXEMPLO (no app de verdade virão do banco) ===== */
var BAIRROS=[{n:"Na cidade",t:2},{n:"Fazenda Caldato",t:4},{n:"Luke",t:4},{n:"Cerro Azul",t:15}];  // locais reais (carniel_taxas_locais); cidade = taxa padrão
var GRUPOS=[{"id": "ofertas", "nome": "Ofertas", "itens": [{"id": 1, "nome": "Boa do Dia", "preco": 24, "desc": "Arroz, Mandioca, Carne de porco frita, Banana frita, Salada"}, {"id": 2, "nome": "Econômica", "preco": 22, "desc": "Arroz, Feijão, Ovo frito, Batata, Bife de gado ou filé de frango"}, {"id": 3, "nome": "Fit do Dia", "preco": 24, "desc": "Arroz integral, Feijão, Couve refogada, Ovo cozido, Filé de frango na chapa, Salada, Frutas"}, {"id": 4, "nome": "Meteoro da Paixão", "preco": 20, "desc": "Arroz, Frango desfiado com creme de milho, Batata palha"}]}, {"id": "marmitas", "nome": "Marmitas", "itens": [{"id": 10, "nome": "Marmita P", "preco": 25, "desc": "A cozinha monta com o buffet do dia"}, {"id": 11, "nome": "Marmita M", "preco": 27}, {"id": 12, "nome": "Marmita G", "preco": 30}, {"id": 13, "nome": "Marmita P — feijão separado", "preco": 30}, {"id": 14, "nome": "Marmita M — feijão separado", "preco": 32}, {"id": 15, "nome": "Marmita G — feijão separado", "preco": 35}, {"id": 16, "nome": "Marmita M dupla", "preco": 42}, {"id": 17, "nome": "Marmita G dupla", "preco": 45}]}, {"id": "pers", "nome": "Personalizada", "tipo": "pers", "itens": [{"id": "PERS", "nome": "Personalizada", "preco": null}]}, {"id": "pizza", "nome": "Pizzas", "escolha": ["Crua", "Assada"], "itens": [{"id": 20, "nome": "Pizza de Mussarela", "preco": 40}, {"id": 21, "nome": "Pizza de Calabresa", "preco": 40}, {"id": 22, "nome": "Pizza de Frango", "preco": 40}]}, {"id": "saladas", "nome": "Saladas", "itens": [{"id": 30, "nome": "Maionese de batata", "preco": 20}, {"id": 30, "nome": "Maionese de maçã", "preco": 20}, {"id": 30, "nome": "Saladas diversas", "preco": 20}, {"id": 30, "nome": "Queijos variados", "preco": 20}]}, {"id": "tapiocas", "nome": "Tapiocas", "itens": [{"id": 40, "nome": "Frango com queijo e orégano", "preco": 21}, {"id": 41, "nome": "Presunto, queijo, tomate e orégano", "preco": 21}, {"id": 42, "nome": "Queijo, brócolis, bacon e orégano", "preco": 21}, {"id": 43, "nome": "Tapioca de três queijos", "preco": 21}, {"id": 44, "nome": "Queijo, calabresa, tomate e orégano", "preco": 21}, {"id": 45, "nome": "Frango com catupiry e orégano", "preco": 21}, {"id": 46, "nome": "Goiabada com queijo", "preco": 21}, {"id": 47, "nome": "Nutella com banana ou doce de leite", "preco": 21}, {"id": 48, "nome": "Nutella com morango", "preco": 21}, {"id": 49, "nome": "KitKat e queijo", "preco": 21}, {"id": 50, "nome": "Galak e queijo", "preco": 21}, {"id": 51, "nome": "Prestígio", "preco": 21}, {"id": 52, "nome": "Ovomaltine", "preco": 21}, {"id": 53, "nome": "Leite Ninho com morango ou banana", "preco": 21}]}, {"id": "bebidas", "nome": "Bebidas", "itens": [{"id": 119, "nome": "Água com gás", "preco": 4}, {"id": 120, "nome": "Água sem gás", "preco": 4}, {"id": 125, "nome": "Refrigerante lata", "preco": 8}, {"id": 126, "nome": "Refrigerante lata zero", "preco": 8}, {"id": 127, "nome": "Refrigerante 600 ml", "preco": 10}, {"id": 128, "nome": "Refrigerante zero 600 ml", "preco": 10}, {"id": 129, "nome": "Refrigerante 2 litros", "preco": 16}, {"id": 130, "nome": "Refrigerante zero 2 litros", "preco": 16}, {"id": 121, "nome": "Suco Prats 300 ml", "preco": 7}, {"id": 122, "nome": "Suco Prats 900 ml", "preco": 15}, {"id": 123, "nome": "Suco Prats 1,5 litros", "preco": 20}, {"id": 124, "nome": "Red Bull 250 ml", "preco": 12}]}];  // ofertas e bebidas de 22/11 (cardápio real do banco)
/* Itens do buffet: lista real do cardápio de 17/11 (Cardápio Completo + Carnes), só para ver como fica */
var BUFFET_HOJE=["Arroz branco","Arroz integral","Feijão","Lentilha","Macarrão ao molho vermelho","Mandioca cozida","Fortaia","Farofa","Batatinha frita","Polenta sapecada","Ovo frito","Repolho e couve refogado","Radite refogado com bacon e ovo","Frango com creme de milho","Pizza doce","Pizza salgada","Bolinho de pão doce","Bolinho de pão","Banana frita","Chuleta / bife de gado na chapa","Filé de frango na chapa","Costelinha de porco frita","Carne de gado ao molho"];
/* No teste: adicione ?fechado=1 no endereço para ver o app fechado */
var ABERTO=location.search.indexOf("fechado")<0;

/* ===== ESTADO ===== */
var S={view:"home",modo:null,grupo:"ofertas",cart:[],sheet:null,end:{apelido:"",bairro:"Na cidade",rua:"",num:"",comp:""},pag:"Pix",troco:"",pedidos:[],enderecos:[],ultimo:null};
try{S.pedidos=JSON.parse(localStorage.getItem("pc_pedidos")||"[]");S.enderecos=JSON.parse(localStorage.getItem("pc_end")||"[]");}catch(e){}
function salvar(){try{localStorage.setItem("pc_pedidos",JSON.stringify(S.pedidos));localStorage.setItem("pc_end",JSON.stringify(S.enderecos));}catch(e){}}

/* ===== UTIL ===== */
function $(s){return document.querySelector(s)}
function brl(v){return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function grupoDe(gid){return GRUPOS.filter(function(g){return g.id===gid})[0]}
function totais(linhas,taxa){var sub=0,pend=false;linhas.forEach(function(l){if(l.preco==null){pend=true}else{sub+=l.preco*l.qtd}});return {sub:sub,taxa:taxa||0,total:sub+(taxa||0),pend:pend}}
function taxaAtual(){if(S.modo!=="Entrega")return 0;var b=BAIRROS.filter(function(x){return x.n===S.end.bairro})[0];return b?b.t:0}
function ir(v){S.view=v;render();window.scrollTo(0,0)}

/* ===== TELAS ===== */
function vHome(){
 var h='<header><span><img class="logo" src="logo.png" alt="">Restaurante Carniel</span><small>'+(ABERTO?"Aberto para pedidos":"Fechado")+'</small></header><div class="pad">';
 if(ABERTO){
  h+='<h2>Como quer receber?</h2><button class="btn" onclick="escolherModo(\'Entrega\')">🛵 Entrega</button><button class="btn" onclick="escolherModo(\'Retirada\')">🏪 Retirada</button>';
 }else{
  h+='<h2>Pedidos encerrados por hoje</h2><p>Atendemos pelo app das 09:30 às 13:30. Você pode ver seus pedidos de hoje.</p><button class="btn sec" onclick="ir(\'pedidos\')">Ver meus pedidos</button>';
 }
 return h+'</div>';
}
function escolherModo(m){S.modo=m;ir("menu")}
function vMenu(){
 var h='<header>Cardápio de hoje<small>'+(S.modo||'')+'</small></header><div class="tabs">';
 GRUPOS.forEach(function(g){h+='<button class="'+(g.id===S.grupo?"on":"")+'" onclick="S.grupo=\''+g.id+'\';render()">'+esc(g.nome)+'</button>'});
 h+='</div>';
 if(grupoDe(S.grupo).tipo==="pers")h+='<div class="aviso" style="background:#e8f1ff;color:#0b4ea2">Monte a sua marmita marcando os itens. O valor é definido na pesagem. Quer outra diferente? Monte de novo e insira outra Personalizada.</div>';
 if(grupoDe(S.grupo).aviso)h+='<div class="aviso" style="background:#e8f1ff;color:#0b4ea2">'+esc(grupoDe(S.grupo).aviso)+'</div>';
 grupoDe(S.grupo).itens.forEach(function(i){
  h+='<div class="item" onclick="abrirItem(\''+S.grupo+'\',\''+i.id+'\')"><span>'+esc(i.nome)+(i.desc?'<small style="display:block;font-size:12px;color:#777;font-weight:400">'+(S.grupo==="ofertas"?"Hoje: ":"")+esc(i.desc)+'</small>':'')+'</span>'+(i.preco==null?'<span class="p ac">preço na pesagem</span>':'<span class="p">'+brl(i.preco)+'</span>')+'</div>';
 });
 return h;
}
function abrirItem(gid,iid){
 var g=grupoDe(gid),it=g.itens.filter(function(x){return String(x.id)===String(iid)})[0];
 S.sheet={gid:gid,item:it,pers:g.tipo==="pers",qtd:1,obs:"",marcados:[],esc:null,opcoes:g.escolha||null};render();
}
function vSheet(){
 var s=S.sheet,h='<div class="sheetbg"><div class="sheet"><h2>'+esc(s.item.nome)+'</h2>';
 if(s.pers){
  h+='<div class="peq">Itens do buffet de hoje — marque o que quiser:</div>';
  BUFFET_HOJE.forEach(function(n,k){h+='<label class="ck"><input type="checkbox" '+(s.marcados.indexOf(n)>=0?"checked":"")+' onchange="marcar(\''+n.replace(/'/g,"\\'")+'\')"> '+esc(n)+'</label>'});
 }
 if(s.opcoes){h+='<div class="peq">Escolha:</div>';s.opcoes.forEach(function(o){h+='<label class="ck"><input type="radio" name="esc" '+(s.esc===o?'checked':'')+' onchange="S.sheet.esc=\''+o+'\'"> '+o+'</label>'})}
 if(!s.pers)h+='<div class="qty"><button onclick="mudaQtd(-1)">−</button><span>'+s.qtd+'</span><button onclick="mudaQtd(1)">+</button></div>';
 h+='<textarea id="obs" rows="2" placeholder="Observação (opcional)" oninput="S.sheet.obs=this.value">'+esc(s.obs)+'</textarea>';
 var sub=s.item.preco==null?"valor na pesagem":brl(s.item.preco*s.qtd);
 h+='<button class="btn" onclick="inserir()">Inserir no carrinho — '+sub+'</button><button class="btn sec" onclick="S.sheet=null;render()">Cancelar</button></div></div>';
 return h;
}
function marcar(n){var m=S.sheet.marcados,k=m.indexOf(n);if(k>=0)m.splice(k,1);else m.push(n)}
function mudaQtd(d){S.sheet.qtd=Math.max(1,S.sheet.qtd+d);var o=S.sheet.obs;render();}
function inserir(){
 var s=S.sheet;
 if(s.opcoes&&!s.esc){alert("Escolha: "+s.opcoes.join(" ou ")+".");return}
 if(s.pers&&s.marcados.length===0){alert("Marque pelo menos um item do buffet.");return}
 S.cart.push({nome:s.item.nome+(s.esc?" ("+s.esc.toLowerCase()+")":""),preco:s.item.preco,qtd:s.pers?1:s.qtd,obs:s.obs.trim(),marcados:s.marcados.slice(),pers:s.pers});
 renum();S.sheet=null;render();
}
/* Personalizadas: 1 só = "Personalizada"; 2 ou mais = "Personalizada 1", "Personalizada 2"... */
function renum(){var ps=S.cart.filter(function(l){return l.pers});ps.forEach(function(l,k){l.nome=ps.length>1?"Personalizada "+(k+1):"Personalizada"})}
function vCart(){
 var h='<header>Carrinho<small>'+(S.modo||'')+'</small></header><div class="pad">';
 if(!S.cart.length){return h+'<p>Seu carrinho está vazio.</p><button class="btn sec" onclick="ir(\'menu\')">Ver o cardápio</button></div>'}
 S.cart.forEach(function(l,k){
  h+='<div class="box"><b>'+esc(l.nome)+'</b>'+(l.marcados.length?'<div class="peq">'+esc(l.marcados.join(", "))+'</div>':'')+(l.obs?'<div class="peq">Obs: '+esc(l.obs)+'</div>':'')+
  (l.pers?'<div class="linha"><button class="rm" onclick="cartQtd('+k+',-1)">Remover</button><span style="font-size:15px">valor na pesagem</span></div></div>':'<div class="qty"><button onclick="cartQtd('+k+',-1)">−</button><span>'+l.qtd+'</span><button onclick="cartQtd('+k+',1)">+</button><span style="margin-left:auto;font-size:15px">'+(l.preco==null?'valor na pesagem':brl(l.preco*l.qtd))+'</span></div></div>');
 });
 h+='<div class="peq">Quer adicionar alguma bebida?</div>';
 grupoDe("bebidas").itens.forEach(function(b){h+='<span class="chip" onclick="addBebida('+b.id+')">+ '+esc(b.nome)+' '+brl(b.preco)+'</span>'});
 var t=totais(S.cart,0);
 h+='<div class="linha tot"><span>Subtotal</span><span>'+brl(t.sub)+'</span></div>'+(t.pend?'<div class="peq">Mais o valor das Personalizadas, definido na pesagem.</div>':'');
 return h+'<button class="btn" onclick="ir(\'checkout\')">Fechar pedido</button><button class="btn sec" onclick="ir(\'menu\')">Adicionar mais itens</button></div>';
}
function cartQtd(k,d){S.cart[k].qtd+=d;if(S.cart[k].qtd<1)S.cart.splice(k,1);renum();render()}
function addBebida(id){var b=grupoDe("bebidas").itens.filter(function(x){return x.id===id})[0];var ex=S.cart.filter(function(l){return l.nome===b.nome&&!l.obs})[0];if(ex)ex.qtd++;else S.cart.push({nome:b.nome,preco:b.preco,qtd:1,obs:"",marcados:[]});render()}

function vCheckout(){
 var h='<header>Fechar pedido<small>'+(S.modo||'')+'</small></header><div class="pad">';
 h+='<div class="box"><b>Seu pedido</b>';
 S.cart.forEach(function(l){h+='<div class="linha"><span>'+l.qtd+'x '+esc(l.nome)+'</span><span>'+(l.preco==null?'a pesar':brl(l.preco*l.qtd))+'</span></div>'+(l.marcados.length?'<div class="peq">'+esc(l.marcados.join(", "))+'</div>':'')+(l.obs?'<div class="peq">Obs: '+esc(l.obs)+'</div>':'')});
 h+='<button class="rm" onclick="ir(\'cart\')">Alterar itens</button></div>';
 if(S.modo==="Entrega"){
  h+='<h2>Endereço</h2>';
  S.enderecos.forEach(function(e,k){h+='<span class="chip" onclick="usaEnd('+k+')">'+esc(e.apelido||e.rua)+'</span>'});
  h+='<select onchange="S.end.bairro=this.value;render()">'+BAIRROS.map(function(b){return '<option '+(S.end.bairro===b.n?"selected":"")+'>'+esc(b.n)+'</option>'}).join("")+'</select>'+
  '<input placeholder="Rua" value="'+esc(S.end.rua)+'" oninput="S.end.rua=this.value">'+
  '<input placeholder="Número" value="'+esc(S.end.num)+'" oninput="S.end.num=this.value">'+
  '<input placeholder="Complemento (opcional)" value="'+esc(S.end.comp)+'" oninput="S.end.comp=this.value">'+
  '<input placeholder="Apelido deste endereço (casa, firma…) — opcional" value="'+esc(S.end.apelido)+'" oninput="S.end.apelido=this.value">';
 }
 h+='<h2>Pagamento (na entrega/retirada)</h2>';
 ["Pix","Cartão","Dinheiro"].forEach(function(p){h+='<label class="ck"><input type="radio" name="pag" '+(S.pag===p?"checked":"")+' onchange="S.pag=\''+p+'\';render()"> '+p+'</label>'});
 if(S.pag==="Dinheiro")h+='<input placeholder="Troco para quanto? (opcional)" value="'+esc(S.troco)+'" oninput="S.troco=this.value">';
 var t=totais(S.cart,taxaAtual());
 h+='<div class="box"><div class="linha"><span>Itens</span><span>'+brl(t.sub)+'</span></div>'+(S.modo==="Entrega"?'<div class="linha"><span>Taxa de entrega</span><span>'+brl(t.taxa)+'</span></div>':'')+
 '<div class="linha tot"><span>Total</span><span>'+brl(t.total)+'</span></div>'+(t.pend?'<div class="peq">Mais o valor das Personalizadas, definido na pesagem. Você recebe o valor no WhatsApp.</div>':'')+'</div>';
 return h+'<button class="btn" onclick="finalizar()">Enviar pedido</button><button class="btn sec" onclick="ir(\'menu\')">Voltar ao cardápio</button></div>';
}
function usaEnd(k){S.end=JSON.parse(JSON.stringify(S.enderecos[k]));render()}
function finalizar(){
 if(S.modo==="Entrega"&&(!S.end.rua.trim()||!S.end.num.trim())){alert("Preencha rua e número.");return}
 var t=totais(S.cart,taxaAtual());
 var num=100+S.pedidos.length+1;
 var p={id:num,itens:S.cart.slice(),modo:S.modo,end:S.modo==="Entrega"?JSON.parse(JSON.stringify(S.end)):null,pag:S.pag,troco:S.troco,sub:t.sub,taxa:t.taxa,total:t.total,pend:t.pend,status:"Recebido"};
 if(p.end){var ja=S.enderecos.some(function(e){return e.rua===p.end.rua&&e.num===p.end.num&&e.bairro===p.end.bairro});if(!ja)S.enderecos.push(JSON.parse(JSON.stringify(p.end)))}
 S.pedidos.unshift(p);S.ultimo=p;S.cart=[];salvar();ir("done");
}
function copiaTexto(p){
 var l=["Pedido #"+p.id];
 p.itens.forEach(function(i){l.push(i.qtd+"x "+i.nome+(i.marcados.length?": "+i.marcados.join(", "):"")+(i.obs?" ("+i.obs+")":"")+(i.preco==null?" — valor na pesagem":""))});
 l.push(p.modo==="Entrega"?"Entrega: "+p.end.rua+", "+p.end.num+(p.end.comp?" - "+p.end.comp:"")+" - "+p.end.bairro:"Retirada no restaurante");
 l.push("Pagamento: "+p.pag+(p.pag==="Dinheiro"&&p.troco?" (troco para "+p.troco+")":""));
 if(p.modo==="Entrega"){l.push("Itens: "+brl(p.sub));l.push("Taxa de entrega: "+brl(p.taxa))}
 l.push("Total: "+brl(p.total)+(p.pend?" + Personalizada(s) a pesar":""));
 l.push("");l.push("🔒 Este pedido já está salvo no sistema. Editar esta mensagem não altera nada. Para mudar, fale com a gente.");
 return l.join("\n");
}
function vDone(){
 var p=S.ultimo;
 return '<header>Pedido enviado ✅</header><div class="pad"><h2>Pedido #'+p.id+' recebido</h2><p>Já está no sistema e na impressora da cozinha. Você vai receber uma cópia no WhatsApp:</p><pre>'+esc(copiaTexto(p))+'</pre><button class="btn" onclick="ir(\'pedidos\')">Ver meus pedidos</button></div>';
}
function vPedidos(){
 var h='<header>Meus pedidos</header><div class="pad">';
 if(!S.pedidos.length)h+='<p>Você ainda não fez pedidos hoje.</p>';
 S.pedidos.forEach(function(p,k){
  h+='<div class="box"><b>Pedido #'+p.id+'</b> <span class="chip'+(p.status==="Entregue"?" ok":"")+'">'+p.status+'</span><div class="peq">'+p.modo+' • '+p.pag+'</div>';
  p.itens.forEach(function(i){h+='<div class="linha"><span>'+i.qtd+'x '+esc(i.nome)+'</span><span>'+(i.preco==null?'a pesar':brl(i.preco*i.qtd))+'</span></div>'});
  h+='<div class="linha tot"><span>Total</span><span>'+brl(p.total)+(p.pend?' + pesagem':'')+'</span></div>'+
  '<div class="peq">Só no protótipo: <button class="rm" onclick="avancar('+k+')">avançar status</button>'+(p.pend?' • <button class="rm" onclick="pesar('+k+')">equipe pesou (R$ 30)</button>':'')+'</div></div>';
 });
 return h+'</div>';
}
function avancar(k){var o=["Recebido","Em preparo","Entregue"],p=S.pedidos[k];p.status=o[Math.min(2,o.indexOf(p.status)+1)];salvar();render()}
function pesar(k){var p=S.pedidos[k];p.itens.forEach(function(i){if(i.preco==null)i.preco=30});var t=totais(p.itens,p.taxa);p.sub=t.sub;p.total=t.total;p.pend=false;salvar();render()}

/* ===== MONTAGEM ===== */
function render(){
 var v=S.view,h="";
 if(!ABERTO&&(v==="menu"||v==="cart"||v==="checkout"))v="home";
 if(v==="home")h=vHome();
 else if(v==="menu")h=vMenu();
 else if(v==="cart")h=vCart();
 else if(v==="checkout")h=S.cart.length?vCheckout():vCart();
 else if(v==="done")h=vDone();
 else if(v==="pedidos")h=vPedidos();
 if(ABERTO===false||true){h='<div class="aviso">PROTÓTIPO com dados de exemplo — nada aqui vai para o restaurante.</div>'+h}
 var q=S.cart.reduce(function(a,l){return a+l.qtd},0);
 if(v==="menu"&&q>0&&!S.sheet){var tb=totais(S.cart,0);h+='<div class="barra" onclick="ir(\'checkout\')"><span>🛒 '+q+(q===1?" item":" itens")+'</span><b>Fechar pedido</b><span>'+brl(tb.sub)+(tb.pend?'<small>+ pesagem</small>':'')+'</span></div>'}
 if(S.sheet)h+=vSheet();
 $("#app").innerHTML=h;
 var tabs=[["home","Início"],["cart","Carrinho"+(q?" ("+q+")":"")],["pedidos","Pedidos"]];
 $("#nav").innerHTML=tabs.map(function(t){var on=(v===t[0])||(t[0]==="home"&&(v==="menu"))||(t[0]==="cart"&&v==="checkout")||(t[0]==="pedidos"&&v==="done");return '<button class="'+(on?"on":"")+'" onclick="ir(\''+t[0]+'\')">'+t[1]+'</button>'}).join("");
}
render();
</script>
</body>
</html>
